ance`,name:`Sin rendirse`,description:`Resuelve una pregunta después de utilizar una pista.`,qualifies:e=>e.assisted},{id:`perfection`,name:`Perfección`,description:`Obtén la puntuación máxima en una actividad educativa.`,qualifies:e=>e.perfect},{id:`explorer`,name:`Explorador de Axo`,description:`Completa una actividad de Matemáticas, Ortografía y Lectura.`,qualifies:e=>e.math>0&&e.spelling>0&&e.reading>0}];function hr(e){let t=Number.isSafeInteger(e)?Math.max(0,e):0,n=e=>50*(e-1)*e,r=Math.floor((1+Math.sqrt(1+t/100*8))/2);return n(r)>t&&r--,n(r+1)<=t&&r++,{level:r,inLevel:t-n(r),nextLevelXp:100*r}}var gr=[{id:`el-misterio-del-canal`,title:`El misterio del canal`,genre:`Misterio y aventura`,description:`Dos amigos siguen una pista en los canales de Xochimilco y descubren cómo cuidar una toma de agua junto con sus vecinos.`,chapters:[{id:`una-marca-roja`,title:`Una marca roja`,order:1,estimatedReadingMinutes:2,paragraphs:[{id:`p1`,text:`El sábado por la mañana, Inés ayudaba a su tía Mar a contar las cajas de acelgas en una chinampa de Xochimilco. Desde el embarcadero se veían pasar las trajineras. Tomás, su compañero de secundaria, había llevado un cuaderno para el proyecto escolar sobre el agua. Quería dibujar el canal, pero Inés le pidió que esperara. Había algo raro junto a la toma por donde entraba agua a los surcos de la chinampa.`},{id:`p2`,text:`Una cuerda roja atravesaba la bocana. Cada pocos segundos daba un tirón y el agua se arremolinaba cerca de un poste. En la madera había tres rayas de gis azul. Tomás pensó que alguien había dejado una trampa para peces. Inés se agachó en la orilla y miró durante un rato. Los tirones coincidían con el paso de las trajineras, incluso cuando no se veía ningún animal.`},{id:`p3`,text:`La tía Mar cerró la compuerta de riego antes de acercarse. La noche anterior había llovido y una abertura del canal arrastraba ramas y envases hacia la toma. Les explicó que el agua no había llegado al último surco. Si jalaban la cuerda desde allí, podían desprender algo pesado y golpear la compuerta. Les pidió que observaran desde el embarcadero mientras ella avisaba a la cooperativa.`},{id:`p4`,text:`Inés dibujó el poste, la cuerda y la dirección en que se movían las hojas flotantes. Tomás anotó la hora de dos tirones fuertes. Al comparar sus apuntes, notaron que la cuerda iba hacia una curva oculta por los ahuejotes. Desde su sitio no podían ver el otro extremo. La tía Mar regresó con una noticia: al día siguiente, don Beto, canoero de la cooperativa, podría llevarlos a mirar la curva desde una canoa.`}]},{id:`lo-que-detiene-la-cuerda`,title:`Lo que detiene la cuerda`,order:2,estimatedReadingMinutes:2,paragraphs:[{id:`p1`,text:`Don Beto les prestó chalecos salvavidas antes de subir a la canoa. Les pidió que dejaran las manos dentro de la embarcación y que avisaran si veían algo flotando cerca de la proa. Tomás llevaba el cuaderno metido en una bolsa. Desde el agua, su dibujo del día anterior parecía incompleto: antes de la curva había una entrada angosta que desde el embarcadero quedaba tapada por los árboles.`},{id:`p2`,text:`Al doblar encontraron una barrera hecha con cañas y dos bidones cerrados que la mantenían a flote. La cuerda roja la amarraba a la orilla y al poste de la toma. Había hojas y botellas atrapadas contra las cañas. Cuando pasó una trajinera, su ola empujó los bidones, la cuerda se tensó y la barrera giró hasta tapar parte de la entrada. Inés pudo ver el mismo remolino del día anterior.`},{id:`p3`,text:`En la orilla, una mujer con botas de hule levantó la mano. Era Sol, vecina de la chinampa de enfrente. Había instalado la barrera después de la lluvia para que los envases no llegaran al canal grande. Las rayas de gis del poste marcaban el nivel del agua durante tres visitas. Sol había notado que se juntaba basura, pero no sabía que su barrera se movía lo suficiente para estorbar el riego.`},{id:`p4`,text:`Don Beto sostuvo la canoa a distancia mientras Inés le enseñaba a Sol su dibujo. Entre los tres señalaron una orilla baja que permitiría recoger lo atrapado con un gancho desde tierra. Si cambiaban el amarre, la barrera quedaría inclinada hacia ese punto y lejos de la toma. Sol quiso oír también a la tía Mar antes de moverla. Tomás dibujó la nueva posición y dejó espacio para anotar qué ocurría cuando pasara otra trajinera.`}]},{id:`una-prueba-con-olas`,title:`Una prueba con olas`,order:3,estimatedReadingMinutes:2,paragraphs:[{id:`p1`,text:`El lunes, antes de entrar a clases, Inés y Tomás volvieron al canal con permiso de sus familias. La tía Mar se había reunido con Sol y don Beto. Acordaron cambiar un solo amarre de la barrera y esperar a ver cómo se comportaba con las olas. Mientras los adultos trabajaban desde la orilla, Inés y Tomás recogieron con pinzas las botellas accesibles desde el sendero y las separaron de las ramas.`},{id:`p2`,text:`La primera trajinera pasó despacio. Los bidones se movieron, pero la cuerda ya no cruzaba la bocana. Una tapa de plástico, que venía flotando desde la curva, chocó contra las cañas y se deslizó hacia la orilla baja. Tomás quiso dar la prueba por terminada. Inés le recordó que las embarcaciones del fin de semana levantaban olas más grandes. Esperaron a que pasaran otras dos mientras la tía Mar abría la compuerta.`},{id:`p3`,text:`El agua alcanzó el último surco. La barrera siguió en su sitio, aunque una manga de plástico se coló por debajo. Sol la retiró desde tierra con el gancho. Después, anotó que revisaría el amarre tras la próxima lluvia. Don Beto se ofreció a avisar si veía ramas grandes y la tía Mar acordó informar a la cooperativa cuando limpiara la toma. La cuerda quedó puesta y Sol borró las marcas de gis para empezar un registro con fechas en su libreta.`},{id:`p4`,text:`En la escuela, Tomás pegó los dos dibujos del canal sobre una cartulina. En el primero todavía se leía «posible trampa». Quiso cubrir la frase con una hoja blanca, pero Inés propuso dejarla al lado de las horas de los tirones y del dibujo de la barrera. Cuando una compañera preguntó quién había resuelto el misterio, Tomás señaló las firmas bajo la cartulina: allí estaban también los nombres de quienes habían explicado y movido la cuerda.`}]}],author:`Equipo Axo`},{id:`el-laboratorio-de-luna`,title:`El laboratorio de Luna`,genre:`Ciencia y aventura`,description:`Luna y Gael ponen a prueba sus ideas para ayudar al huerto escolar durante una semana de calor.`,chapters:[{id:`tierra-seca`,title:`Tierra seca`,order:1,estimatedReadingMinutes:2,paragraphs:[{id:`p1`,text:`Luna entró al huerto de la secundaria justo antes del recreo y encontró las hojas de los rábanos dobladas hacia el suelo. La directora había avisado que cerrarían la llave del patio durante dos tardes por una reparación. El grupo podía llenar dos cubetas por la mañana, pero nadie sabía si ese riego bastaría hasta el día siguiente. El profesor Saúl les propuso averiguar de qué manera podían mantener húmeda la tierra.`},{id:`p2`,text:`Gael sugirió cubrirla con hojas secas: su abuelo lo hacía en sus macetas. Luna señaló que bajo una tabla olvidada la tierra estaba oscura, mientras que la que recibía sol directo parecía polvo. Quería saber si las hojas tendrían un efecto parecido. Decidieron comparar seis macetas con tierra tomada del mismo montón. Tres llevarían hojas encima y tres quedarían descubiertas. Todas tendrían la misma cantidad de tierra y recibirían el mismo volumen de agua.`},{id:`p3`,text:`Primero pensaron dejar las macetas cubiertas cerca del salón, donde nadie las pisaría. Al medir el espacio, Luna notó que allí daba sombra desde el mediodía. Si las macetas cubiertas quedaban a la sombra y las descubiertas al sol, el resultado podía deberse a cualquiera de esas diferencias. Gael encontró una mesa amplia junto a la malla del huerto. Alternaron macetas cubiertas y descubiertas en dos filas y pusieron una cuerda para que nadie se acercara demasiado.`},{id:`p4`,text:`El profesor les prestó una báscula de cocina. Si pesaban cada maceta después de regar y otra vez al día siguiente, podrían comparar cuánto peso había perdido. Gael escribió su predicción: las macetas con hojas perderían menos agua. Luna preparó una tabla para registrar los datos y dejó en blanco la columna de resultados. Todavía faltaba acordar qué hacer si los números no coincidían con lo que esperaban.`}]},{id:`el-resultado-extrano`,title:`El resultado extraño`,order:2,estimatedReadingMinutes:2,paragraphs:[{id:`p1`,text:`Al día siguiente, Luna puso la primera maceta en la báscula y Gael buscó el registro del peso inicial. Dos de las macetas descubiertas habían perdido casi el doble de peso que las cubiertas. La tercera descubierta, en cambio, pesaba más que el día anterior. Gael creyó que había copiado mal un número, pero la foto de la báscula que tomó Luna al empezar coincidía con la tabla.`},{id:`p2`,text:`Al revisar la mesa, encontraron agua debajo de una unión de la manguera que cruzaba por encima de la malla. La unión goteaba cuando el conserje abría la llave para limpiar el pasillo. Las gotas caían cerca de la maceta que había ganado peso. Gael propuso tachar ese número y calcular el promedio con lo que quedaba. Luna prefirió conservarlo con una nota sobre la fuga, porque explicaba por qué no era comparable con los demás.`},{id:`p3`,text:`El profesor Saúl les preguntó si podían repetir el ensayo antes de la reparación. Aún quedaba un día. Entre los dos buscaron otra mesa con iluminación parecida y lejos de la manguera. El conserje les prestó un recipiente para medir el agua con mayor precisión. También decidieron pesar las macetas después de que dejaran de gotear por los agujeros de abajo, para que una diferencia en el drenaje inicial no confundiera la comparación.`},{id:`p4`,text:`Gael marcó las dos series con colores en la libreta: la primera incluía el incidente y la segunda empezaba esa tarde. Luna fotografió la nueva mesa, con las macetas alternadas y sus etiquetas visibles. Mientras guardaban la báscula, vieron a la directora pasar con una de las cubetas. Les avisó que el corte de agua empezaría al día siguiente justo después del recreo. La segunda medición tendría que hacerse antes de preparar el huerto.`}]},{id:`lo-que-dicen-seis-macetas`,title:`Lo que dicen seis macetas`,order:3,estimatedReadingMinutes:2,paragraphs:[{id:`p1`,text:`En el recreo, Luna y Gael repitieron la medición. En la segunda serie, las tres macetas con hojas perdieron entre veintidós y veintisiete gramos. Las descubiertas perdieron entre cuarenta y dos y cincuenta. Gael propuso poner en el cartel que las hojas siempre conservaban la mitad del agua. Luna volvió a mirar los datos: los valores eran parecidos, pero algunos no daban exactamente la mitad. Además, su ensayo solo había durado un día.`},{id:`p2`,text:`Redactaron una conclusión más precisa: en las macetas del ensayo, la tierra cubierta con hojas perdió menos agua que la descubierta. El profesor les recordó que las plantas del huerto también absorbían agua por las raíces, algo que el experimento con las macetas sin plantas no había medido. Para probar la idea en el huerto, eligieron dos franjas parecidas de rábanos y pusieron hojas solo en una. Dejaron libre un pequeño círculo alrededor de cada tallo y regaron las dos con el mismo volumen.`},{id:`p3`,text:`A la mañana siguiente, ambas franjas seguían en pie. En la tierra descubierta, la superficie estaba más clara. Gael hundió un dedo cerca de una raíz y descubrió humedad debajo. La franja cubierta también estaba húmeda, incluso cerca de la superficie. Anotaron dónde habían revisado la tierra y decidieron observar las plantas varios días antes de afirmar que alguna franja crecería mejor. Cuando reabrieron la llave, el conserje les avisó antes de empezar a regar.`},{id:`p4`,text:`En el cartel final incluyeron la primera tabla con el dato de la maceta mojada y la segunda con las seis mediciones comparables. Una compañera preguntó por qué habían mostrado una prueba que salió mal. Gael le acercó la foto de la fuga y la invitó a señalar qué había cambiado entre las dos mesas. Después, le dejó un espacio en la libreta para que anotara su propia pregunta sobre las hojas y el huerto.`}]}],author:`Equipo Axo`},{id:`la-ciudad-de-las-palabras`,title:`La ciudad de las palabras`,genre:`Fantasía`,description:`Mara y su primo cruzan una puerta que obedece las palabras de sus habitantes y descubren lo que ocurre cuando una instrucción admite dos lecturas.`,chapters:[{id:`la-puerta-de-los-letreros`,title:`La puerta de los letreros`,order:1,estimatedReadingMinutes:2,paragraphs:[{id:`p1`,text:`Mara y Leo llevaban las llaves del puesto de su abuela cuando empezó a llover. Se refugiaron bajo un arco de piedra que ninguno recordaba haber visto en esa calle. En el muro había un letrero con una frase grabada: «Cuando alguien diga adelante, se abrirá una puerta». Leo leyó la frase en voz alta. Al pronunciar la palabra indicada, una abertura apareció en la piedra. Del otro lado se oía pregonar pan recién hecho.`},{id:`p2`,text:`Cruzaron y llegaron a una plaza donde las instrucciones escritas parecían gobernar las cosas. Un letrero que decía «Las bancas miran al quiosco» mantenía las bancas orientadas hacia la música. Cuando una panadera escribió «La campana sonará al abrir», la campana esperó hasta que ella levantó la cortina del puesto. Mara quiso probar con su propio papel, pero solo tenía el recibo de unas naranjas y prefirió guardarlo.`},{id:`p3`,text:`Junto a la fuente, Ada, encargada de los letreros, discutía con dos cargadores. Un carro con harina no podía cruzar el puente de la plaza. El mensaje que lo regulaba decía: «Dejen pasar a los carros sin carga pesada». El puente dejaba pasar los carros vacíos y frenaba cualquier otro. Los cargadores decían que las bolsas de harina, tomadas una por una, no pesaban demasiado. El carro, sin embargo, llevaba doce.`},{id:`p4`,text:`Ada sacó un mensaje anterior escrito por el carpintero: «No más de cien kilos sobre el puente». Alguien había cambiado la frase por otra más corta y había quitado la cantidad. Mara pidió una báscula para saber cuánto pesaba el carro. Leo apuntó hacia el letrero de la panadería, que acababa de caer de su gancho. La panadera lo recogió: con la humedad, la tinta empezaba a correrse. Ada miró hacia el puente y les pidió que se apresuraran.`}]},{id:`cien-kilos-sobre-el-puente`,title:`Cien kilos sobre el puente`,order:2,estimatedReadingMinutes:2,paragraphs:[{id:`p1`,text:`La báscula del mercado quedaba bajo un techo de lámina. Los cargadores pesaron primero el carro vacío: treinta kilos. Luego pesaron las doce bolsas de harina. Cada una pesaba seis kilos, así que el carro cargado sumaba ciento dos. Uno de los cargadores propuso sostener una bolsa con los brazos durante el cruce. Leo le pidió que pensara dónde estarían sus propios pies y qué peso añadirían al puente.`},{id:`p2`,text:`En vez de empujarlo, podían tirar del carro desde la otra orilla con una cuerda y dejar el paso libre durante la maniobra. Si quitaban una bolsa, el carro pesaría noventa y seis kilos. Ada consultó al carpintero y él confirmó que el límite se refería al peso total presente en el puente. Mara redactó un aviso: «El peso total sobre el puente no debe superar cien kilos». Lo escribieron en una cartulina seca.`},{id:`p3`,text:`El carro cruzó con once bolsas mientras los cargadores tiraban desde el otro lado. La bolsa restante viajó después, en brazos de Ada, tras comprobar que ella y la harina pesaban menos de cien kilos. La panadera pudo encender el horno a tiempo. Guardó la cartulina vieja, con la frase borrosa sobre la carga pesada, para enseñarla a quienes redactarían los avisos del siguiente día de mercado.`},{id:`p4`,text:`En la plaza ya se oía la lluvia contra el techo de lámina. Mara miró su reloj y se acordó de su abuela, que estaría esperando las llaves. Buscaron el arco por el que habían entrado. Allí había otro letrero, esta vez en el lado de la plaza: «Vuelvan cuando esto termine». Leo dijo que el problema del puente ya había terminado, pero el arco siguió cerrado. Mara se fijó en la palabra «esto» y se preguntó a qué se refería.`}]},{id:`una-salida-para-dos`,title:`Una salida para dos`,order:3,estimatedReadingMinutes:2,paragraphs:[{id:`p1`,text:`Ada se acercó al arco con una carpeta de avisos viejos. El arco lo habían instalado para una feria de inventos. Durante la feria, el mensaje de regreso se refería al espectáculo del quiosco, que terminaba cada tarde con tres campanadas. Después habían retirado el escenario provisional, pero habían dejado el letrero. Desde entonces, Ada abría el arco manualmente con una llave que esa mañana había prestado al carpintero.`},{id:`p2`,text:`Leo propuso esperar a que cesara la lluvia y probar de nuevo. Mara señaló que también podían esperar a que el horno terminara de cocer el pan, y que el mensaje sería igual de impreciso. Recordó lo que había pasado con «carga pesada». Ada les dio una cartulina en blanco y les dijo que el arco admitía otro mensaje si lo colocaban en el marco donde estaba el anterior.`},{id:`p3`,text:`Mara escribió: «La puerta hacia la calle del puesto de frutas se abrirá cuando alguien lea este letrero en voz alta». Leo leyó el anuncio sin saltarse palabras y el marco se iluminó. Desde el lado de la plaza pudieron ver el puesto de su abuela enfrente. Antes de cruzar, Leo esperó a que Mara se acomodara la mochila. El arco permaneció abierto. Habían indicado cómo abrirlo, pero todavía faltaba decidir cuándo debía cerrarse.`},{id:`p4`,text:`Ada añadió en otra línea que la puerta se cerraría después de que todos los que estuvieran cruzando llegaran al otro lado. Mara volvió a leer el aviso y los dos atravesaron juntos. Su abuela recibió las llaves y les pidió ayuda para guardar las naranjas. Mientras plegaban el toldo, Leo sacó del bolsillo el recibo húmedo. En el reverso dibujó el arco y dejó un espacio para anotar, la próxima vez, cómo entrar desde la calle y cómo volver desde la plaza
