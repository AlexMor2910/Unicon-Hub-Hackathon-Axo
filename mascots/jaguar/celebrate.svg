<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 224" role="img" aria-label="Un jaguar celebrando" class="anim st-celebrate">
<title>Un jaguar celebrando</title>
<style>.anim,.anim *{transform-box:fill-box}
.char{transform-origin:50% 100%}
.shadow{transform-origin:50% 50%}
.eye{transform-origin:50% 50%}
.st-idle .char{animation:breathe 3.2s ease-in-out infinite}
.st-idle .eye,.st-encourage .eye{animation:blink 4.6s infinite}
.sway-l{transform-origin:100% 60%;animation:sway-l 3.2s ease-in-out infinite}
.sway-r{transform-origin:0% 60%;animation:sway-r 3.2s ease-in-out infinite}
.sway-tail{transform-origin:0% 80%;animation:sway-r 2.6s ease-in-out infinite}
.st-thinking .head{transform-origin:50% 90%;animation:ponder 2.8s ease-in-out infinite}
.st-thinking .dot{animation:dot 1.8s ease-in-out infinite;opacity:.15}
.st-thinking .dot:nth-of-type(2){animation-delay:.3s}
.st-thinking .dot:nth-of-type(3){animation-delay:.6s}
.st-celebrate .char{animation:hop .6s cubic-bezier(.3,.7,.4,1) 2}
.st-celebrate .shadow{animation:squash .6s cubic-bezier(.3,.7,.4,1) 2}
.st-celebrate .spark{transform-origin:50% 50%;animation:twinkle .9s ease-in-out 3 both}
.st-celebrate .spark:nth-of-type(2){animation-delay:.2s}
.st-celebrate .spark:nth-of-type(3){animation-delay:.4s}
.st-celebrate .wing-l{transform-origin:100% 20%;animation:flap-l .3s ease-in-out 4}
.st-celebrate .wing-r{transform-origin:0% 20%;animation:flap-r .3s ease-in-out 4}
.st-encourage .head{transform-origin:50% 90%;animation:nod .8s ease-in-out 2}
.st-encourage .heart{transform-origin:50% 50%;animation:pulse 1.2s ease-in-out 3}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,.985)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes sway-l{0%,100%{transform:rotate(0)}50%{transform:rotate(-4deg)}}
@keyframes sway-r{0%,100%{transform:rotate(0)}50%{transform:rotate(4deg)}}
@keyframes ponder{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(-5deg) translateY(-1px)}}
@keyframes dot{0%,15%{opacity:.15}45%,100%{opacity:1}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}15%{transform:translateY(0) scale(1.04,.95)}45%{transform:translateY(-20px) scale(.98,1.03)}75%{transform:translateY(0) scale(1.03,.97)}}
@keyframes squash{0%,100%{transform:scale(1)}45%{transform:scale(.8);opacity:.7}}
@keyframes twinkle{0%{transform:scale(.3);opacity:0}50%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes flap-l{0%,100%{transform:rotate(0)}50%{transform:rotate(18deg)}}
@keyframes flap-r{0%,100%{transform:rotate(0)}50%{transform:rotate(-18deg)}}
@keyframes nod{0%,100%{transform:rotate(0)}30%{transform:rotate(4deg) translateY(2px)}60%{transform:rotate(-2deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@media (prefers-reduced-motion:reduce){.anim *{animation:none!important}.dot,.spark{opacity:1!important}}</style>
<ellipse class="shadow" cx="162" cy="199" rx="104" ry="11" fill="#b7ddd3"/><g class="char">
  <g class="sway-tail">
    <path d="M206 182 Q250 188 258 150 Q262 128 247 118" fill="none" stroke="#f2b544" stroke-width="14" stroke-linecap="round"/>
    <path d="M233 178 L240 172 M251 160 L259 157 M257 138 L264 139" stroke="#3a2a1f" stroke-width="4" stroke-linecap="round"/>
    <path d="M256 133 Q258 124 247 118" fill="none" stroke="#3a2a1f" stroke-width="14" stroke-linecap="round"/>
  </g>
  <ellipse cx="159" cy="171" rx="58" ry="30" fill="#f2b544"/>
  <ellipse cx="159" cy="180" rx="33" ry="18" fill="#fde8c4"/>
  <circle cx="118" cy="164" r="6" fill="#c97a22" stroke="#3a2a1f" stroke-width="3" stroke-dasharray="6.6 3.5"/><circle cx="198" cy="163" r="6" fill="#c97a22" stroke="#3a2a1f" stroke-width="3" stroke-dasharray="6.6 3.5"/><circle cx="206" cy="183" r="5" fill="#c97a22" stroke="#3a2a1f" stroke-width="3" stroke-dasharray="5.5 3.5"/><circle cx="112" cy="184" r="5" fill="#c97a22" stroke="#3a2a1f" stroke-width="3" stroke-dasharray="5.5 3.5"/>
  <path d="M113 176 Q96 186 110 193 H130 M205 176 Q222 186 208 193 H188" fill="#fde8c4"/>
  <g class="head">
    <g class="sway-l"><circle cx="106" cy="80" r="21" fill="#e29a2e"/><circle cx="106" cy="80" r="10" fill="#f3a58f"/></g>
    <g class="sway-r"><circle cx="214" cy="80" r="21" fill="#e29a2e"/><circle cx="214" cy="80" r="10" fill="#f3a58f"/></g>
    <ellipse cx="160" cy="117" rx="76" ry="50" fill="#f2b544"/>
    <circle cx="160" cy="80" r="5" fill="#c97a22" stroke="#3a2a1f" stroke-width="3" stroke-dasharray="5.5 3.5"/><circle cx="134" cy="86" r="4.5" fill="#c97a22" stroke="#3a2a1f" stroke-width="3" stroke-dasharray="5.0 3.5"/><circle cx="186" cy="86" r="4.5" fill="#c97a22" stroke="#3a2a1f" stroke-width="3" stroke-dasharray="5.0 3.5"/><circle cx="96" cy="112" r="5" fill="#c97a22" stroke="#3a2a1f" stroke-width="3" stroke-dasharray="5.5 3.5"/><circle cx="224" cy="112" r="5" fill="#c97a22" stroke="#3a2a1f" stroke-width="3" stroke-dasharray="5.5 3.5"/>
    <ellipse cx="160" cy="133" rx="28" ry="18" fill="#fde8c4"/>
    <ellipse cx="114" cy="126" rx="9" ry="5.5" fill="#f08a6a"/>
    <ellipse cx="206" cy="126" rx="9" ry="5.5" fill="#f08a6a"/>
    <path d="M131 134 L112 131 M131 140 L114 144 M189 134 L208 131 M189 140 L206 144" stroke="#9b6a35" stroke-width="2" stroke-linecap="round"/>
    <path d="M125 111 Q132 101 139 111 M181 111 Q188 101 195 111" fill="none" stroke="#342749" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M152 120 Q160 116 168 120 Q160 130 152 120 Z" fill="#6b3a2e"/>
    <path d="M160 127 V130"  stroke="#342749" stroke-width="3" stroke-linecap="round"/><path d="M147 131 H173 Q160 152 147 131 Z" fill="#342749" stroke="#342749" stroke-width="3" stroke-linejoin="round"/><path d="M153 140 Q160 146 167 140 Q160 150 153 140 Z" fill="#f06f9f"/>
  </g>
</g>
<g fill="#fbbf24"><path class="spark" d="M250 32 Q250 46 264 46 Q250 46 250 60 Q250 46 236 46 Q250 46 250 32 Z"/><path class="spark" d="M64 42 Q64 52 74 52 Q64 52 64 62 Q64 52 54 52 Q64 52 64 42 Z"/><path class="spark" d="M280 88 Q280 96 288 96 Q280 96 280 104 Q280 96 272 96 Q280 96 280 88 Z"/></g>
</svg>
